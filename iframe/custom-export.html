<!doctype html>
<html lang="zh-Hans">
<head>
	<title>自定义导出</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			padding: 16px;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			font-size: 14px;
			color: #333;
			background: #fff;
			display: flex;
			flex-direction: column;
			height: 100vh;
		}
		h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; flex-shrink: 0; }
		.table-wrap {
			border: 1px solid #e0e0e0;
			border-radius: 4px;
			overflow: hidden;
			margin-bottom: 12px;
			flex: 1;
			display: flex;
			flex-direction: column;
			min-height: 0;
		}
		table {
			width: 100%;
			border-collapse: collapse;
			flex: 1;
			display: flex;
			flex-direction: column;
			min-height: 0;
		}
		thead {
			background: #f5f5f5;
			flex-shrink: 0;
		}
		th {
			padding: 8px 12px;
			text-align: left;
			font-weight: 600;
			border-bottom: 1px solid #e0e0e0;
			white-space: nowrap;
		}
		th label { font-weight: 600; }
		tbody {
			flex: 1;
			overflow-y: auto;
			min-height: 0;
		}
		thead, tbody tr {
			display: table;
			width: 100%;
			table-layout: fixed;
		}
		td {
			padding: 8px 12px;
			border-bottom: 1px solid #f0f0f0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			vertical-align: middle;
		}
		tbody tr:nth-child(even) { background: #fafafa; }
		tbody tr:hover { background: #f0f7ff; }
		tbody tr.dragging { opacity: 0.6; background: #e6f7ff; }
		tbody tr.drag-over { border-top: 2px solid #1890ff; }
		.col-sort { width: 80px; }
		.col-color { width: 56px; }
		.col-opacity { width: 90px; }
		.col-mirror { width: 72px; text-align: right; }
		.col-mirror label { justify-content: flex-end; }
		.col-export { width: calc(100% - 298px); }
		.opacity-input {
			width: 60px;
			height: 20px;
			padding: 0 4px;
			border: 1px solid #d9d9d9;
			border-radius: 3px;
			font-size: 12px;
			text-align: center;
		}
		.color-swatch {
			position: relative;
			width: 28px;
			height: 20px;
			border-radius: 3px;
			border: 1px solid #d9d9d9;
			cursor: pointer;
			overflow: hidden;
		}
		.color-swatch input[type="color"] {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			padding: 0;
			border: 0;
			background: transparent;
			cursor: pointer;
			opacity: 0;
		}
		.drag-handle {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 18px;
			cursor: grab;
			color: #999;
			font-size: 12px;
			line-height: 1;
			user-select: none;
			margin-right: 8px;
		}
		.drag-handle:active { cursor: grabbing; }
		.sort-num {
			display: inline-block;
			min-width: 18px;
			color: #999;
			font-size: 12px;
			text-align: center;
		}
		label { cursor: pointer; display: flex; align-items: center; gap: 6px; }
		input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; }
		.mode {
			margin: 0;
			padding: 10px 12px;
			border: 1px solid #e0e0e0;
			border-radius: 4px;
			background: #fafafa;
			flex-shrink: 0;
		}
		.mode label { display: inline-flex; margin-right: 20px; }
		.buttons {
			display: flex;
			justify-content: flex-end;
			gap: 10px;
			margin-top: 12px;
			flex-shrink: 0;
		}
		button {
			padding: 8px 18px;
			border: 1px solid #d9d9d9;
			border-radius: 4px;
			background: #fff;
			cursor: pointer;
			font-size: 14px;
		}
		button.primary {
			background: #1890ff;
			color: #fff;
			border-color: #1890ff;
		}
		button:hover { opacity: 0.85; }
		.empty { padding: 20px; text-align: center; color: #999; }
	</style>
</head>
<body>
	<h3>选择层</h3>
	<div class="table-wrap">
		<table>
			<thead>
				<tr>
					<th class="col-sort">排序</th>
						<th class="col-color">颜色</th>
						<th class="col-opacity">透明度</th>
					<th class="col-export">
						<label>
							<input type="checkbox" id="selectAllExport" />
							<span>导出层</span>
						</label>
					</th>
					<th class="col-mirror">
						<label>
							<input type="checkbox" id="selectAllMirror" />
							<span>镜像</span>
						</label>
					</th>
				</tr>
			</thead>
			<tbody id="layerList"></tbody>
		</table>
	</div>

	<div class="mode">
		<label><input type="radio" name="exportMode" value="merge" checked /> 合并导出</label>
		<label><input type="radio" name="exportMode" value="separate" /> 独立导出</label>
	</div>

	<div class="buttons">
		<button id="cancelBtn">取消</button>
		<button id="okBtn" class="primary">确定</button>
	</div>

	<script>
		let layers = [];
		let order = [];
		const selectedSet = new Set();
		const mirroredSet = new Set();
		const layerMap = new Map();
		const colorMap = new Map();
		const opacityMap = new Map();

		function displayNameOf(l) {
			return l.displayName || l.layerName || l.originalFilename || '';
		}

		function escapeHtml(s) {
			return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
		}

		function render() {
			const tbody = document.getElementById('layerList');
			if (!layers.length) {
				tbody.innerHTML = '<tr><td colspan="5" class="empty">没有可用的层</td></tr>';
				return;
			}
			tbody.innerHTML = order.map((filename, i) => {
				const l = layerMap.get(filename);
				if (!l) return '';
				const name = displayNameOf(l);
				const color = colorMap.get(filename) || l.color || '#888888';
				const opacity = opacityMap.get(filename) ?? l.opacity ?? 1;
				const opacityPercent = Math.round(opacity * 100);
				return `
					<tr draggable="true" data-filename="${escapeHtml(filename)}">
						<td class="col-sort">
							<span class="drag-handle" title="拖动排序">⋮⋮</span>
							<span class="sort-num">${i + 1}</span>
						</td>
						<td class="col-color">
							<div class="color-swatch" title="点击修改颜色" style="background-color: ${escapeHtml(color)}">
								<input type="color" class="color-picker" data-filename="${escapeHtml(filename)}" value="${escapeHtml(color)}" />
							</div>
						</td>
						<td class="col-opacity">
							<input type="number" class="opacity-input" data-filename="${escapeHtml(filename)}" value="${opacityPercent}" min="0" max="100" step="1" title="不透明度百分比" />
						</td>
						<td class="col-export">
							<label>
								<input type="checkbox" class="export-cb" data-filename="${escapeHtml(filename)}" ${selectedSet.has(filename) ? 'checked' : ''} />
								<span title="${escapeHtml(name)}">${escapeHtml(name)}</span>
							</label>
						</td>
						<td class="col-mirror">
							<label>
								<input type="checkbox" class="mirror-cb" data-filename="${escapeHtml(filename)}" ${mirroredSet.has(filename) ? 'checked' : ''} />
								<span>镜像</span>
							</label>
						</td>
					</tr>
				`;
			}).join('');
			updateSelectAllState();
			bindDragEvents();
		}

		function bindDragEvents() {
			const tbody = document.getElementById('layerList');
			let dragFilename = null;

			tbody.querySelectorAll('tr').forEach((tr) => {
				tr.addEventListener('dragstart', (e) => {
					dragFilename = tr.dataset.filename;
					tr.classList.add('dragging');
					e.dataTransfer.effectAllowed = 'move';
					e.dataTransfer.setData('text/plain', dragFilename);
				});
				tr.addEventListener('dragend', () => {
					tr.classList.remove('dragging');
					tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
					dragFilename = null;
				});
				tr.addEventListener('dragover', (e) => {
					e.preventDefault();
					if (!dragFilename || dragFilename === tr.dataset.filename) return;
					e.dataTransfer.dropEffect = 'move';
					tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
					tr.classList.add('drag-over');
				});
				tr.addEventListener('dragleave', () => {
					tr.classList.remove('drag-over');
				});
				tr.addEventListener('drop', (e) => {
					e.preventDefault();
					tbody.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'));
					const targetFilename = tr.dataset.filename;
					if (!dragFilename || dragFilename === targetFilename) return;
					const from = order.indexOf(dragFilename);
					const to = order.indexOf(targetFilename);
					if (from < 0 || to < 0) return;
					order.splice(from, 1);
					order.splice(to, 0, dragFilename);
					render();
				});
			});
		}

		function post(type, payload) {
			window.parent.postMessage({ type, ...payload }, '*');
		}

		function updateSelectAllState() {
			const exportCbs = document.querySelectorAll('.export-cb');
			const mirrorCbs = document.querySelectorAll('.mirror-cb');
			document.getElementById('selectAllExport').checked = exportCbs.length > 0 && Array.from(exportCbs).every(cb => cb.checked);
			document.getElementById('selectAllMirror').checked = mirrorCbs.length > 0 && Array.from(mirrorCbs).every(cb => cb.checked);
		}

		window.addEventListener('message', (e) => {
			if (!e.data || typeof e.data !== 'object') return;
			if (e.data.type === 'init') {
				layers = Array.isArray(e.data.layers) ? e.data.layers : [];
				layerMap.clear();
				selectedSet.clear();
				mirroredSet.clear();
				colorMap.clear();
				opacityMap.clear();
				for (const l of layers) {
					layerMap.set(l.originalFilename, l);
					selectedSet.add(l.originalFilename);
					if (l.color) colorMap.set(l.originalFilename, l.color);
					if (typeof l.opacity === 'number') opacityMap.set(l.originalFilename, l.opacity);
				}
				order = layers.map(l => l.originalFilename);
				render();
			}
		});

		document.getElementById('selectAllExport').addEventListener('change', (e) => {
			document.querySelectorAll('.export-cb').forEach((cb) => {
				const filename = cb.dataset.filename;
				if (e.target.checked) selectedSet.add(filename);
				else selectedSet.delete(filename);
				cb.checked = e.target.checked;
			});
		});

		document.getElementById('selectAllMirror').addEventListener('change', (e) => {
			document.querySelectorAll('.mirror-cb').forEach((cb) => {
				const filename = cb.dataset.filename;
				if (e.target.checked) mirroredSet.add(filename);
				else mirroredSet.delete(filename);
				cb.checked = e.target.checked;
			});
		});

		document.getElementById('layerList').addEventListener('change', (e) => {
			if (e.target.classList.contains('export-cb')) {
				const filename = e.target.dataset.filename;
				if (e.target.checked) selectedSet.add(filename);
				else selectedSet.delete(filename);
				updateSelectAllState();
			}
			else if (e.target.classList.contains('mirror-cb')) {
				const filename = e.target.dataset.filename;
				if (e.target.checked) mirroredSet.add(filename);
				else mirroredSet.delete(filename);
				updateSelectAllState();
			}
			else if (e.target.classList.contains('color-picker')) {
				const filename = e.target.dataset.filename;
				const value = e.target.value;
				colorMap.set(filename, value);
				const swatch = e.target.closest('.color-swatch');
				if (swatch) swatch.style.backgroundColor = value;
			}
			else if (e.target.classList.contains('opacity-input')) {
				const filename = e.target.dataset.filename;
				let value = Number(e.target.value);
				if (Number.isNaN(value)) value = 100;
				value = Math.max(0, Math.min(100, value));
				opacityMap.set(filename, value / 100);
				e.target.value = value;
			}
		});

		document.getElementById('okBtn').addEventListener('click', () => {
			const selected = order.filter(f => selectedSet.has(f));
			const mirrored = order.filter(f => mirroredSet.has(f));
			const merge = document.querySelector('input[name="exportMode"]:checked')?.value === 'merge';
			const colors = {};
			const opacities = {};
			for (const filename of selected) {
				const c = colorMap.get(filename);
				if (c) colors[filename] = c;
				const o = opacityMap.get(filename);
				if (typeof o === 'number') opacities[filename] = o;
			}
			post('result', { selected, mirrored, order: selected, merge, colors, opacities });
		});

		document.getElementById('cancelBtn').addEventListener('click', () => {
			post('cancel', {});
		});

		post('ready', {});
	</script>
</body>
</html>
